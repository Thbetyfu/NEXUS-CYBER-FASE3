# Nexus Cyber — GitLab CI (mirror of the GitHub Actions gate)
# Docs: https://docs.gitlab.com/ci/yaml/

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"

gateway-test:
  stage: test
  image: golang:1.22
  needs: []
  cache:
    key:
      files:
        - nexus-core-gateway/go.sum
    paths:
      - .cache/go-build
      - .cache/go-mod
  variables:
    GOPATH: $CI_PROJECT_DIR/.cache/go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  script:
    - cd nexus-core-gateway
    - go mod download
    - go vet ./...
    - go build -o /tmp/nexus-gateway ./cmd/gateway
    - go test -coverprofile=coverage.out ./...
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - nexus-core-gateway/coverage.out

nexred-test:
  stage: test
  image: python:3.11-slim
  needs: []
  cache:
    key:
      files:
        - NEX-RED/requirements.txt
    paths:
      - .cache/pip
  script:
    - python -m pip install --upgrade pip
    - pip install -r NEX-RED/requirements.txt
    - python -m unittest discover -s NEX-RED/tests -v

defense-scripts:
  stage: test
  image: python:3.11-slim
  needs: []
  script:
    - python scripts/tests/test_scaffold.py
    - python scripts/tests/test_mtd_shuffle.py
    - python scripts/tests/test_self_repair.py
    - python scripts/tests/test_intelligence.py

compose-validate:
  stage: test
  image: python:3.11-slim
  needs: []
  script:
    - pip install pyyaml
    - python -c "import yaml; yaml.safe_load(open('deploy-local/docker-compose.yml', encoding='utf-8')); yaml.safe_load(open('deploy-local/docker-compose.offline.yml', encoding='utf-8')); print('compose yaml ok')"
