version: "3.8"

services:
  # Distributed Cache / Token Bucket Store
  redis:
    image: redis:7.2-alpine
    container_name: nexus_redis
    # Dihapus demi Security Best Practice (Enterprise Grade)
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Relational Database (Forensic Persistence)
  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexus_cyber
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_cyber"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Core Gateway (Golang)
  gateway:
    build:
      context: ./nexus-core-gateway
      dockerfile: Dockerfile
    container_name: nexus_gateway
    expose:
      - "8080" # Di-expose internal ke Caddy saja (Security Hardening)
    ports:
      - "9090:9090" # Honeypot Port tetap diakses publik untuk menjebak bot
      - "22:2222"   # SSH Tarpit Port
    volumes:
      - ./nexus-core-gateway/geoip:/app/geoip
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_URL=redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL}
      - AI_PROVIDER_KEY=${AI_PROVIDER_KEY}
      - NEXUS_SESSION_SECRET=${NEXUS_SESSION_SECRET:-super-secret-matrix-key-2026}
      - TARGET_BACKEND=http://portfolio:3002
      - REWARD_PASSWORD=${REWARD_PASSWORD:-NexusAccessSecure2026!}
      - REWARD_LINK=${REWARD_LINK:-https://shopee.co.id/m/shopee-kaget-nexus-success}
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # Next.js Command Center SOC (MTD Matrix v13.2)
  dashboard:
    build:
      context: ./nexus-admin-dashboard
      dockerfile: Dockerfile
    container_name: nexus_dashboard
    expose:
      - "3000" # Di-expose internal ke Caddy saja (Security Hardening)
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - gateway
    restart: always

  # [NEW: THE PROTECTED TARGET]
  # Website Portofolio yang akan dijaga oleh Nexus
  portfolio:
    build:
      context: ./Portfolio-website
      dockerfile: Dockerfile
    container_name: target_portfolio
    # Kita TIDAK membuka port portfolio ke publik (Hanya internal Docker)
    # Ini memaksa hacker harus lewat Gateway (8080)
    environment:
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=nexus_portfolio_app
      - DB_PASSWORD=portfolio_secure_pass
      - DB_NAME=nexus_cyber
      - DB_ADMIN_DSN=postgres://nexus:password@postgres:5432/nexus_cyber?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # Caddy Edge Router (Auto-HTTPS & On-Demand TLS SSL)
  caddy:
    image: caddy:2-alpine
    container_name: nexus_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - dashboard

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
