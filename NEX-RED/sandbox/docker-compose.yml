# Optional isolated NEX-RED worker. Does not mount the Docker socket.
# HTTP allow-list stays in Python (sandbox/policy.py). This is not iptables.
services:
  nexred:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    image: nexus-nexred-sandbox:local
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp/nexred:uid=10001,gid=10001,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEX_RED_LIVE_TARGET: http://host.docker.internal
      NEX_RED_JUICE_SHOP_URL: http://host.docker.internal:3003
      NEX_RED_REPORTS_DIR: /tmp/nexred/reports
      NEX_RED_WORKSPACES_DIR: /tmp/nexred/workspaces
    command: ["python", "nexred.py", "scan", "-m", "whitebox", "-r", ".", "--no-llm"]
