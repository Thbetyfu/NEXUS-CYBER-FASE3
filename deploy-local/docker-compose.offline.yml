# Overlay: origin lokal (playground/Portofolio-Thoriq) jika Vercel tidak dipakai.
# Dipakai oleh START-OFFLINE.bat / start.sh --offline
#
# Live self-heal: Go FileServer reads ./dist. Bind-mount host dist (seeded from the
# image on first start) so gateway /origin-lab/dist and portfolio /app/dist are the
# same files — restore without restarting the origin process.

services:
  portfolio:
    build:
      context: ../playground/Portofolio-Thoriq
      dockerfile: Dockerfile
    container_name: nexus-local-portfolio
    environment:
      PORT: "3002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: nexus_portfolio_app
      DB_PASSWORD: portfolio_secure_pass
      DB_NAME: nexus_cyber
      DB_ADMIN_DSN: postgres://nexus:${POSTGRES_PASSWORD:-nexus_local_dev_only}@postgres:5432/nexus_cyber?sslmode=disable
    volumes:
      - ../playground/Portofolio-Thoriq/dist:/app/dist
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/dist/index.html"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    environment:
      TARGET_BACKEND: http://portfolio:3002
      TARGET_BACKEND_HOST: portfolio
      INTEGRITY_MONITORED_DIR: /origin-lab/dist
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      channel-origin:
        condition: service_started
      portfolio:
        condition: service_healthy
