name: Nexus Cyber SAST & Vulnerability Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run security audit automatically every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gosec - Go Static Application Security Testing (SAST)
  # ---------------------------------------------------------------------------
  gosec-sast:
    name: 🔍 Gosec Security Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt=sarif -out=gosec.sarif ./...'
          working-directory: nexus-core-gateway

  # ---------------------------------------------------------------------------
  # 2. Govulncheck - Official Go Dependency Vulnerability Scanner
  # ---------------------------------------------------------------------------
  govulncheck-scan:
    name: 📦 Go Module Dependency CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Dependency Vulnerability Scan
        run: |
          cd nexus-core-gateway
          govulncheck ./... || echo "Vulnerability scan completed with findings."

  # ---------------------------------------------------------------------------
  # 3. Trivy - Secret Leak & Repository Vulnerability Scan
  # ---------------------------------------------------------------------------
  trivy-secret-scan:
    name: 🔑 Trivy Secret Leak & Misconfig Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Secret & Misconfig Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 4. NPM Audit - Frontend Security Dependency Scan
  # ---------------------------------------------------------------------------
  npm-audit:
    name: 🛡️ NPM Frontend Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NPM Security Audit
        run: |
          cd nexus-admin-dashboard
          npm audit --audit-level=high || echo "NPM audit completed with warnings."
