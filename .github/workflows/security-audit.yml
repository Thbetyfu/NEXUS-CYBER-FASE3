name: Nexus Cyber SAST & Vulnerability Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  gosec-sast:
    name: Gosec Security Code Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run gosec
        working-directory: nexus-core-gateway
        env:
          CGO_ENABLED: '0'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4
          gosec -no-fail ./...

  govulncheck-scan:
    name: Go Module Dependency CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run govulncheck
        working-directory: nexus-core-gateway
        env:
          CGO_ENABLED: '0'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... || true

  trivy-secret-scan:
    name: Trivy Secret Leak & Misconfig Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          hide-progress: true
          format: table
          exit-code: '0'
          ignore-unfixed: true

  npm-audit:
    name: NPM Frontend Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run NPM Security Audit
        working-directory: nexus-admin-dashboard
        run: npm audit --audit-level=high || true
