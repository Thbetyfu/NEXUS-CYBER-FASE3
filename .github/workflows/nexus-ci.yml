name: Nexus Cyber CI/CD Core Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Go WAF Gateway - Build, Quality & Unit Test Coverage
  # ---------------------------------------------------------------------------
  gateway-test:
    name: 🛡️ Go WAF Gateway Build & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: nexus-core-gateway/go.sum

      - name: Install Dependencies
        run: |
          cd nexus-core-gateway
          go mod download

      - name: Static Analysis & Code Vet
        run: |
          cd nexus-core-gateway
          go vet ./...

      - name: Compile Gateway Binary
        run: |
          cd nexus-core-gateway
          go build -v ./cmd/gateway

      - name: Run Test Suite with Coverage
        run: |
          cd nexus-core-gateway
          go test -v -coverprofile=coverage.out ./...

      - name: Upload Go Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: nexus-core-gateway/coverage.out
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Frontend Next.js SOC Command Center - Build & Typecheck
  # ---------------------------------------------------------------------------
  dashboard-build:
    name: 💻 Next.js SOC Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nexus-admin-dashboard/package-lock.json

      - name: Install Dependencies
        run: |
          cd nexus-admin-dashboard
          npm ci || npm install

      - name: TypeScript Type Checking
        run: |
          cd nexus-admin-dashboard
          npx tsc --noEmit

      - name: Next.js Production Build
        run: |
          cd nexus-admin-dashboard
          npm run build

  # ---------------------------------------------------------------------------
  # 3. Security & Defense Engine Test Suite (Python Matrix)
  # ---------------------------------------------------------------------------
  security-tests:
    name: 🧪 Security & Defense Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run Scaffold Integrity Test
        run: |
          python scripts/tests/test_scaffold.py

      - name: Run MTD Shuffle Defense Test
        run: |
          python scripts/tests/test_mtd_shuffle.py

      - name: Run Autonomous Self-Repair Test
        run: |
          python scripts/tests/test_self_repair.py

      - name: Run NEX-AI Intelligence Test
        run: |
          python scripts/tests/test_intelligence.py

  # ---------------------------------------------------------------------------
  # 3b. NEX-RED SAST unit tests (must pass before merge)
  # ---------------------------------------------------------------------------
  nexred-test:
    name: NEX-RED unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: NEX-RED/requirements.txt

      - name: Install NEX-RED dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r NEX-RED/requirements.txt

      - name: Run NEX-RED unittest
        run: python -m unittest discover -s NEX-RED/tests -v

  # ---------------------------------------------------------------------------
  # 4. Infrastructure & Docker Containers Audit
  # ---------------------------------------------------------------------------
  docker-validation:
    name: 🐳 Docker Infrastructure & Image Build Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mock Sibling Build Context for CI Compose Validation
        run: |
          mkdir -p ../Portfolio-website
          echo "FROM alpine:latest" > ../Portfolio-website/Dockerfile

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Validate deploy-local Compose
        run: |
          docker compose -f deploy-local/docker-compose.yml config --quiet

      - name: Test Build Gateway Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-core-gateway
          file: ./nexus-core-gateway/Dockerfile
          push: false
          tags: nexus-cyber/gateway:test
