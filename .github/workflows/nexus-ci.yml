name: Nexus Cyber CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Go WAF Gateway - Compilation & Unit Testing
  # ---------------------------------------------------------------------------
  gateway-test:
    name: 🛡️ Go WAF Gateway Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: nexus-core-gateway/go.sum

      - name: Install Go Dependencies
        run: |
          cd nexus-core-gateway
          go mod download

      - name: Compile Gateway Binary
        run: |
          cd nexus-core-gateway
          go build -v ./cmd/gateway

      - name: Run Go Unit & Integration Test Suite
        run: |
          cd nexus-core-gateway
          go test -v ./...

  # ---------------------------------------------------------------------------
  # 2. Frontend Next.js SOC Command Center - Build & Typecheck
  # ---------------------------------------------------------------------------
  dashboard-build:
    name: 💻 Next.js SOC Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nexus-admin-dashboard/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd nexus-admin-dashboard
          npm ci || npm install

      - name: Compile Next.js Production Build
        run: |
          cd nexus-admin-dashboard
          npm run build

  # ---------------------------------------------------------------------------
  # 3. Security & Automation Python Test Suite
  # ---------------------------------------------------------------------------
  security-tests:
    name: 🧪 Security & Automation Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Execute Scaffold & Unit Test Suite
        run: |
          python scripts/tests/test_scaffold.py

  # ---------------------------------------------------------------------------
  # 4. Infrastructure & Docker Compose Schema Audit
  # ---------------------------------------------------------------------------
  docker-validation:
    name: 🐳 Docker Compose & Infrastructure Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
