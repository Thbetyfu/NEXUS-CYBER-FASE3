name: Nexus Cyber CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gateway-test:
    name: Go WAF Gateway Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: nexus-core-gateway/go.sum

      - name: Install Dependencies
        run: |
          cd nexus-core-gateway
          go mod download

      - name: Build Gateway
        run: |
          cd nexus-core-gateway
          go build -v ./...

      - name: Run Test Suite
        run: |
          cd nexus-core-gateway
          go test -v ./...

  dashboard-build:
    name: Next.js Admin Dashboard Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nexus-admin-dashboard/package-lock.json

      - name: Install Dependencies
        run: |
          cd nexus-admin-dashboard
          npm ci || npm install

      - name: Compile Next.js App
        run: |
          cd nexus-admin-dashboard
          npm run build

  portfolio-build:
    name: Vite Portfolio Website Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Portfolio-website/package-lock.json

      - name: Install Dependencies
        run: |
          cd Portfolio-website
          npm ci || npm install

      - name: Compile Vite App
        run: |
          cd Portfolio-website
          npm run build
